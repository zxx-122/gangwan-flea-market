spring:
  datasource:
    url: jdbc:h2:file:./data/gwtzsc;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connectionInitSql: "SET NAMES utf8"
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
